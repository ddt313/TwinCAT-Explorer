# Releases the VS Code extension when master gets a version that has no tag yet: merging develop into master with
# a new version in package.json (and its section in CHANGELOG.md) is the whole release. This workflow pushes the tag
# v<version> on master's commit, then runs the Release workflow (release.yml) for it, which builds, tests, attaches
# the .vsix to a GitHub release and publishes it to the Marketplace.
#
# A push to master whose version is tagged already releases nothing. A tag pushed by GITHUB_TOKEN starts no
# workflow, so the Release workflow is called from here rather than started by the tag.
#
# The tag is pushed only once CHANGELOG.md has the version's section: a pushed tag is never moved, so a release that
# would fail on its notes must stop before it. Pre-releases (a version with a -) on their own branches, and the
# browser extension (browser-v*), are still released by pushing their tag.
name: Tag release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency: tag-release

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag package.json's version when it has no tag yet
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is tagged already: nothing to release."
            exit 0
          fi
          if ! grep -qE "^## $(printf '%s' "$version" | sed 's/[.]/\\./g')( |$)" CHANGELOG.md; then
            echo "::error::package.json has $version, which has no tag yet, but CHANGELOG.md has no section '## $version - <date>'. Rename its Unreleased section."
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    # Repository secrets (AZURE_CLIENT_ID, AZURE_TENANT_ID); those of the marketplace environment reach it anyway.
    secrets: inherit
