<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Explorer for TwinCAT</title>
<style>
  body { width: 300px; margin: 0; padding: 10px 12px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 6px; font-size: 13px; }
  p { margin: 6px 0; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  .muted { color: GrayText; font-size: 12px; }
  button { margin: 4px 0; padding: 4px 10px; font: inherit; cursor: pointer; }
  label.auto { display: flex; gap: 6px; align-items: flex-start; margin: 8px 0 4px; cursor: pointer; }
  label.auto input { margin: 2px 0 0; }
  #update:not(:empty) { margin: 6px 0 8px; padding: 6px 8px; border: 1px solid #1f6feb; border-radius: 6px; }
  #update p { margin: 2px 0; }
  footer { margin-top: 10px; padding-top: 4px; border-top: 1px solid color-mix(in srgb, GrayText 40%, transparent); }
</style>
</head>
<body>
<h1>Explorer for TwinCAT <span id="version" class="muted"></span></h1>
<div id="update"></div>
<main id="root"></main>
<footer><label class="auto muted"><input type="checkbox" id="updates"> Look for new versions on GitHub, once a day</label></footer>
<script src="popup.js"></script>
</body>
</html>
